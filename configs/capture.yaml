# Thu thập — sao chép configs/channels.example.csv thành configs/channels.csv rồi điền kênh thật.
channels_csv: configs/channels.csv
raw_dir: data/raw
poll_seconds: 120            # chu kỳ kiểm tra kênh có live không (cũng là sai số tối đa của "ghi từ đầu phiên")
max_concurrent: 8            # số kết nối đồng thời; tăng dần khi đã chắc máy + dịch vụ ký chịu được
offline_grace_minutes: 15    # offline quá mốc này thì coi là hết phiên
max_sessions_per_day: 15     # số phiên MỚI mỗi ngày (giờ VN); phiên không nối được thì hoàn lại; null = không giới hạn
only_from_start: false       # true = chỉ ghi phiên đã thấy kênh offline trước đó (ghi từ đầu), bỏ qua kênh đang live dở.
                             # 01/10/2026: tắt — shop live liên tục nhiều giờ nên hiếm khi bắt được đầu phiên; ghi mọi
                             # phiên, cờ was_offline_before vẫn cho biết phiên nào ghi từ đầu (ingest: captured_from_start)
start_spacing_seconds: 30    # giãn cách tối thiểu giữa 2 lần mở kết nối (phiên mới HOẶC nối lại), chống rate limit
start_jitter_seconds: 10     # cộng thêm ngẫu nhiên 0..N giây
fsync_every_s: 2             # mất điện đột ngột chỉ mất tối đa ~2 s dữ liệu cuối mỗi phiên (xem capture/writer.py)
store_raw_types: [other]     # ghi payload đã làm sạch cho các sự kiện lạ (để tìm tin hệ thống/mua hàng)

sampling_frame:              # khung 20 ô cho configs/channels.csv (Task 3 kiểm tra theo đây)
  # 5 ngành gốc + cong_nghe (01/10/2026: đang cân nhắc mở rộng thêm ngành; chốt trước khi nộp OSF)
  category_groups: [thoi_trang, my_pham, me_be, gia_dung, thuc_pham, cong_nghe]
  follower_tiers:            # tầng cố định theo followers lúc chọn kênh; cận dưới tính vào tầng
    lt100k: [0, 100000]
    100k_500k: [100000, 500000]
    500k_1m: [500000, 1000000]
    gt1m: [1000000, null]
  channels_per_cell: [8, 10]

session:
  gap_minutes: 15            # dự phòng khi thiếu session_hint (dữ liệu cũ của khóa luận)

session_criteria:            # PROPOSAL: tiêu chí một phiên hợp lệ
  min_duration_min: 30
  max_disconnected_share: 0.10
  require_from_start: true
  # ngưỡng >= 150 bình luận người xem áp dụng SAU khi lọc: configs/filters.yaml -> min_viewer_comments
